name: Update MLS Playlist

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and filter MLS
        shell: python
        run: |
          import urllib.request
          import time
          import re

          SOURCE = (
              "https://raw.githubusercontent.com/Raulpa78/StoM/"
              "refs/heads/main/output/vivo.m3u"
              "?nocache=" + str(int(time.time()))
          )

          OUTPUT = "mls.m3u"

          CATEGORIES = {
              "us| mls network",
              "us| mls ppv vip",
              "us| mls ppv"
          }

          req = urllib.request.Request(
              SOURCE,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as r:
              text = r.read().decode("utf-8", errors="ignore")

          lines = text.splitlines()

          output = ["#EXTM3U"]
          kept = 0
          i = 0

          while i < len(lines):

              line = lines[i].strip()

              if line.startswith("#EXTINF:"):

                  match = re.search(
                      r'group-title="([^"]*)"',
                      line,
                      re.IGNORECASE
                  )

                  if match:
                      category = match.group(1).strip().lower()

                      if category in CATEGORIES:

                          output.append(line)

                          if i + 1 < len(lines):
                              stream = lines[i + 1].strip()

                              if stream and not stream.startswith("#"):
                                  output.append(stream)
                                  kept += 1

                  i += 2

              else:
                  i += 1

          if kept == 0:
              raise SystemExit("ERROR: No MLS channels found!")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print(f"MLS channels kept: {kept}")

      - name: Commit every run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mls.m3u

          git commit --allow-empty -m "Update MLS playlist $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          git push
